# CI telegram-rest-gateway. Гейты — SPEC_ELABORATION §12, §14.9. Полный список
# переменных CI/CD, которые нужно завести в GitLab — docs/CICD.md.
#
# Раннеры (решение C9): 1x amd64 (tag `amd64`), 6x arm64 (общий tag `arm64`).
# Реестр: внешний (Docker Hub / GHCR / Harbor) — креды в REGISTRY_* (protected).
# Деплой: пока только сборка+пуш образа; CD-джоба добавится позже.

stages:
  - builder   # дорогой образ TDLib+Drogon — вручную при смене пинов
  - lint
  - test
  - image

variables:
  # Тег builder-образа для текущей арки (ARCH задаётся в matrix/джобе).
  BUILDER_TAG: "${REGISTRY_IMAGE}:builder-${ARCH}"
  GIT_SUBMODULE_STRATEGY: none

# ---------- общий docker-login для docker-in-docker джоб ----------
.docker:
  image: docker:27
  services: [docker:27-dind]
  variables:
    # non-TLS dind: демон на 2375, без shared-volume с сертификатами (надёжно на self-hosted).
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"

# ---------- builder (TDLib+Drogon), вручную ----------
.builder:
  extends: .docker
  stage: builder
  script:
    - export TDLIB_REF="$(grep -E '^TDLIB_REF=' TDLIB_REF | cut -d= -f2)"
    - export DROGON_REF="$(grep -E '^DROGON_REF=' DROGON_REF | cut -d= -f2)"
    - >
      docker build -f Dockerfile.builder
      --build-arg TDLIB_REF="$TDLIB_REF"
      --build-arg DROGON_REF="$DROGON_REF"
      -t "${REGISTRY_IMAGE}:builder-${ARCH}" .
    - docker push "${REGISTRY_IMAGE}:builder-${ARCH}"
  rules:
    - when: manual
      allow_failure: false

builder:amd64:
  extends: .builder
  tags: [amd64]
  variables: { ARCH: amd64 }

builder:arm64:
  extends: .builder
  tags: [arm64]
  variables: { ARCH: arm64 }

# ---------- lint (в builder-образе: там clang-format/tidy + deps) ----------
clang-format:
  stage: lint
  image: python:3.12-slim
  tags: [amd64]
  before_script:
    - pip install --no-cache-dir clang-format==18.1.8
  script:
    - clang-format --version
    - >
      find src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \)
      | xargs -r clang-format --dry-run --Werror

# Наш код НЕ должен попадать в sanitizer-suppressions (только сторонние символы).
# Игнорируем строки-комментарии (в них слова src//tests/ встречаются легитимно).
suppressions-guard:
  stage: lint
  image: debian:12-slim
  tags: [arm64]
  script:
    - |
      hits=$(grep -rnE '(src/|tests/|tgw::)' cmake/suppressions/ | grep -vE ':[0-9]+:[[:space:]]*#' || true)
      if [ -n "$hits" ]; then
        echo "ОШИБКА: наш код в suppressions — гонки/утечки чиним, а не подавляем:"; echo "$hits"; exit 1;
      fi

# ---------- test (в builder-образе) ----------
.build-and-test:
  stage: test
  image: "$BUILDER_TAG"
  script:
    - cmake --preset "$PRESET"
    - cmake --build --preset "$PRESET"
    - ctest --preset "$PRESET"

tidy:
  stage: test
  image: "${REGISTRY_IMAGE}:builder-amd64"
  tags: [amd64]
  script:
    - cmake --preset dev-debug
    - git ls-files 'src/*.cpp' | xargs -r clang-tidy -p build/dev-debug --warnings-as-errors='bugprone-*,concurrency-*'

test:asan:
  extends: .build-and-test
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  tags: [$ARCH]
  variables:
    PRESET: asan
    ASAN_OPTIONS: "detect_leaks=1"
    LSAN_OPTIONS: "suppressions=$CI_PROJECT_DIR/cmake/suppressions/lsan.supp"

test:tsan:
  extends: .build-and-test
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  tags: [$ARCH]
  variables:
    PRESET: tsan
    TSAN_OPTIONS: "suppressions=$CI_PROJECT_DIR/cmake/suppressions/tsan.supp halt_on_error=1"

# ---------- image (multi-arch service, C9) ----------
.image-build:
  extends: .docker
  stage: image
  script:
    - >
      docker build
      --build-arg BUILDER_IMAGE="${REGISTRY_IMAGE}:builder-${ARCH}"
      -t "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}" .
    - docker push "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

image:amd64:
  extends: .image-build
  tags: [amd64]
  variables: { ARCH: amd64 }

image:arm64:
  extends: .image-build
  tags: [arm64]
  variables: { ARCH: arm64 }

# Слить per-arch образы в один multi-arch манифест.
image:manifest:
  extends: .docker
  stage: image
  tags: [amd64]
  needs: [image:amd64, image:arm64]
  script:
    - >
      docker buildx imagetools create -t "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64"
      "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64"
    - if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker buildx imagetools create -t "${REGISTRY_IMAGE}:latest" "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}";
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

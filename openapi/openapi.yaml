openapi: 3.1.0
info:
  title: telegram-rest-gateway
  version: 0.0.1
  description: >
    REST/WebSocket-обёртка над пользовательским Telegram-аккаунтом (TDLib + Drogon).
    ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ HTTP-контракта. Под него пишутся golden/валидационные тесты
    (SPEC_ELABORATION §14.15). Stage 0 — только каркас: /v1/health, конверты, схема id.
    Остальные пути добавляются по мере этапов 1–5.

servers:
  - url: http://127.0.0.1:8080
    description: локальный запуск за TLS-reverse-proxy

tags:
  - name: system
  - name: auth
  - name: messages
  - name: files

paths:
  /v1/health:
    get:
      tags: [system]
      summary: Liveness — жив ли процесс
      security: []
      responses:
        "200":
          description: сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  status: { type: string, example: alive }

  /v1/ready:
    get:
      tags: [system]
      summary: Readiness — готов ли обслуживать (authorizationStateReady + свежий receive)
      security: []
      responses:
        "200": { description: готов }
        "503":
          description: не готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyState" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  # Все запросы кроме /v1/health и /v1/ready требуют Bearer (§8.1).
  security:
    - bearerAuth: []

  schemas:
    # Все 64-битные идентификаторы — СТРОКИ (§8.2.1), иначе JS-клиенты теряют точность.
    Id:
      type: string
      pattern: '^-?[0-9]+$'
      example: "-1001234567890"

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - AUTH_REQUIRED
                - FLOOD_WAIT
                - RATE_LIMITED
                - SERVICE_STARTING
                - SERVICE_BUSY
                - SERVICE_CLOSING
                - UPSTREAM_TIMEOUT
                - TELEGRAM_ERROR
            message: { type: string }
            tdlib_code: { type: integer, nullable: true }
            tdlib_message: { type: string, nullable: true }
            retry_after: { type: integer, nullable: true }
            request_id: { type: string, nullable: true }

    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, example: true }
        data: {}
        meta:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }

    ReadyState:
      type: object
      properties:
        ready: { type: boolean, example: false }
        state: { type: string, example: starting }
        authorization_state: { type: string, nullable: true }
        connection_state: { type: string, nullable: true }

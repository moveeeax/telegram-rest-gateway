# telegram-rest-gateway — Helm values.
#
# КЛЮЧЕВОЕ ОГРАНИЧЕНИЕ TELEGRAM: одна сессия = ровно один работающий процесс.
# Два пода с одним session_id => Telegram отзывает сессию (AUTH_KEY_DUPLICATED).
# Поэтому: replicas всегда 1 на аккаунт, strategy Recreate, никакого HPA.

image:
  repository: ghcr.io/moveeeax/telegram-rest-gateway
  # ОБЯЗАТЕЛЕН: дефолта нет. CI не публикует semver-теги (нет стабильного "последнего"
  # образа) — публикуются только immutable short-sha теги, см. docs/CICD.md. Задай явно,
  # иначе helm install/template упадёт с понятной ошибкой (fail-fast вместо ImagePullBackOff).
  tag: ""
  pullPolicy: IfNotPresent

# Аккаунты: на каждый рендерится свой Deployment + Service (имя <release>-<sessionId>).
# sessionId — операторская метка (у нас = Telegram account id): путь сессии в S3
# telegram-sessions/<sessionId>/td.binlog и ключи Kafka-событий.
accounts:
  - sessionId: "default"
    # Переопределения env на конкретный аккаунт (список name/value как в PodSpec).
    extraEnv: []

# Secret с секретами гейтвея. Чарт НЕ создаёт секретов из values по умолчанию —
# заведи Secret заранее (kubectl create secret / sealed-secrets / external-secrets):
#   API_ID, API_HASH, DATABASE_ENCRYPTION_KEY, BEARER_TOKENS,
#   TGW_S3_ACCESS_KEY_ID, TGW_S3_SECRET_ACCESS_KEY
existingSecret: "telegram-rest-gateway"

# Общая (несекретная) конфигурация — идёт в ConfigMap, envFrom.
config:
  TGW_LISTEN_ADDRESS: "0.0.0.0"
  TGW_LISTEN_PORT: "8080"
  # S3-хранилище сессий (обязательно для stateless-подов: PVC у чарта нет).
  # Дефолта нет намеренно — своего S3/MinIO под чартом не поставляем; заполни своим
  # эндпоинтом в собственном values-файле (пример структуры — values-prod-example.yaml).
  TGW_S3_ENDPOINT: ""
  TGW_S3_REGION: "us-east-1"
  TGW_S3_BUCKET: "tgw-s3-bucket"
  TGW_S3_PATH_STYLE: "true"
  # Kafka-события: пусто = выключено. Например redpanda.redpanda.svc:9093
  TGW_KAFKA_BROKERS: ""
  TGW_KAFKA_TOPIC: "tgw.updates"
  # Ниже — переменные с дефолтами из образа (config.hpp), сюда добавлять не обязательно; можно
  # переопределить любым ключом (configmap.yaml рендерит весь .Values.config как есть):
  #   TGW_DATABASE_DIR: "/data/session"        # БД TDLib; должен остаться под volumeMounts.data
  #                                             # (mountPath: /data, см. deployment.yaml) — иначе
  #                                             # каталог не переживёт рестарт пода.
  #   TGW_FILES_DIR: "/data/files"              # файлы TDLib; та же оговорка про volume /data.
  #   TGW_MAX_UPLOAD_BYTES: "67108864"          # лимит тела POST /v1/chats/{chatId}/files (64 MiB).
  #   TGW_USE_TEST_DC: "false"                  # "1"/"true" — тестовый DC Telegram вместо прод.
  #   TGW_TDLIB_LOG_VERBOSITY: "1"              # уровень логов TDLib (0 — тихо).
  # TGW_KEEP_ONLINE: "true"                     # держать аккаунт online (setOption online=true
  #                                             # после авторизации + переустановка при реконнекте).
  # TGW_KEEP_ONLINE_INTERVAL_SECONDS: "60"      # период переотправки online-статуса по таймеру.
  #   TGW_WEBHOOKS_ENABLED: "false"             # "1"/"true" — рассылать вебхуки на mention/dm/reply
  #                                             # владельцу (см. README «Вебхуки…»).
  #   TGW_WEBHOOK_TIMEOUT_MS: "10000"           # таймаут HTTP-запроса доставки одного вебхука, мс.
  #   TGW_WEBHOOK_QUEUE_MAX: "10000"            # ёмкость очереди диспетчера; переполнение = дроп
  #                                             # события (tgw_webhook_dropped_total).
  #   TGW_WEBHOOK_SSRF_GUARD: "false"           # "1"/"true" — блокировать доставку на приватные/
  #                                             # loopback/link-local хосты.

service:
  type: ClusterIP
  port: 8080

# Ingress: включи и задай host-шаблон; {sessionId} подставляется на аккаунт.
# Пример: hostTemplate: "tg-{sessionId}.tarassov.me"
ingress:
  enabled: false
  className: ""
  annotations: {}
  hostTemplate: "tg-{sessionId}.example.com"
  tls:
    enabled: false
    secretNameTemplate: "tg-{sessionId}-tls"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# ServiceMonitor для Prometheus Operator (скрейпит /metrics без auth).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Graceful shutdown: под должен успеть закрыть TDLib и запушить сессию в S3.
# Бюджет worst-case (main.cpp): 10s TDLib close + 10s Kafka flush + 45s ожидание фонового
# s3-sync (kSendHangTimeout+10) + до 40s финальный PUT (send + один быстрый ретрай) ≈ 105s.
terminationGracePeriodSeconds: 120

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: false  # /data/session и /data/files пишутся (emptyDir)
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

{{- if .Values.ingress.enabled }}
{{- include "tgw.ingressGuard" . }}
{{- range $account := .Values.accounts }}
{{- $ctx := dict "root" $ "account" $account }}
{{- $host := include "tgw.accountHost" $ctx }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tgw.accountName" $ctx }}
  labels:
    {{- include "tgw.labels" $ | nindent 4 }}
    tgw.tarassov.me/session-id: {{ $account.sessionId | quote }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tgw.accountName" $ctx }}
                port:
                  name: http
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ replace "{sessionId}" $account.sessionId $.Values.ingress.tls.secretNameTemplate }}
  {{- end }}
{{- end }}
{{- end }}

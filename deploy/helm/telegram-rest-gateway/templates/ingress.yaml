{{- if .Values.ingress.enabled }}
{{- include "tgw.ingressGuard" . }}
{{- range $account := .Values.accounts }}
{{- $ctx := dict "root" $ "account" $account }}
{{- $host := include "tgw.accountHost" $ctx }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tgw.accountName" $ctx }}
  labels:
    {{- include "tgw.labels" $ | nindent 4 }}
    tgw.tarassov.me/session-id: {{ $account.sessionId | quote }}
  {{- with include "tgw.ingressAnnotations" $ }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        # Наружу только API и (по флагу) форма логина. /metrics и корень (редирект на /ui) не
        # выставляются. Traefik матчит префикс с учетом регистра, поэтому /METRICS и /UI сюда
        # тоже не попадают, хотя Drogon внутри матчит пути без учета регистра.
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "tgw.accountName" $ctx }}
                port:
                  name: http
          {{- if $.Values.ingress.exposeLoginUi }}
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "tgw.accountName" $ctx }}
                port:
                  name: http
          {{- end }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ replace "{sessionId}" $account.sessionId $.Values.ingress.tls.secretNameTemplate }}
  {{- end }}
{{- end }}
{{- end }}

{{- if and .Values.ingress.enabled .Values.ingress.ipAllowList }}
# IP-allowlist для внешнего Ingress (Traefik). Работает, только если Traefik видит реальный
# IP клиента: в oci-k3s это обеспечивает PROXY protocol от LB (см. DEPLOY.md).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "tgw.ipAllowListName" . }}
  labels:
    {{- include "tgw.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.ipAllowList | nindent 6 }}
{{- end }}

# Пример: MCP и архиватор (/search + /health) наружу через Ingress с IP-allowlist.
# /backfill и /stats архиватора наружу не выставляются (path-restrict в template).
# Если архиватор только внутри кластера — оставь archiverHost: "".
archiver:
  image:
    # CI не тегирует образ semver — пиньте неизменяемый short-sha релиза (тег image:<sha> в реестре).
    tag: "da77e294"  # неизменяемый short-sha
mcp:
  image:
    tag: "da77e294"  # неизменяемый short-sha
  # Пример владельца: реальные Telegram account id (совпадают с accounts гейтвея);
  # в дефолтах чарта mcp.accounts пуст.
  accounts:
    - sessionId: "1214732998"
    - sessionId: "1389231240"
ingress:
  enabled: true
  className: nginx
  mcpHostTemplate: "mcp-{sessionId}.example.com"
  archiverHost: "tgw-archive.example.com"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "<LB-IP>"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "<your.ip>/32"
    # Streamable HTTP / SSE — без буферизации, длинные таймауты.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true

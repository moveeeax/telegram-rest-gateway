# Пример: MCP и архиватор (/search + /health) наружу через Ingress с IP-allowlist.
# /backfill и /stats архиватора наружу не выставляются (path-restrict в template).
# Если архиватор только внутри кластера — оставь archiverHost: "".
archiver:
  image:
    # CI не тегирует образ semver — пиньте неизменяемый short-sha релиза (тег image:<sha> в реестре).
    tag: "da77e294"  # неизменяемый short-sha
mcp:
  image:
    tag: "da77e294"  # неизменяемый short-sha
  # Единый MCP на mcp.tarassov.me (токен клиента из онбординга или токен владельца).
  shared:
    enabled: true
  # Пример владельца: реальные Telegram account id (совпадают с accounts гейтвея);
  # в дефолтах чарта mcp.accounts пуст.
  accounts:
    - sessionId: "1000000001"
    - sessionId: "1000000002"
ingress:
  enabled: true
  className: traefik
  mcpHostTemplate: "mcp-{sessionId}.example.com"
  archiverHost: "tgw-archive.example.com"
  ipAllowList: ["<your.ip>/32"]
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "<LB-IP>"
    # Streamable HTTP / SSE: у Traefik entrypoint websecure таймауты 3600s и буферизации ответа
    # по умолчанию нет, отдельные аннотации не нужны.
  tls:
    enabled: true

# Control plane и общие хосты (план docs/superpowers/plans/2026-10-18-control-plane.md).
controlPlane:
  enabled: true
  image:
    tag: "<short-sha>"
  workerImage: "ghcr.io/moveeeax/telegram-rest-gateway:<short-sha>"
  mcpBaseUrl: "https://mcp.tarassov.me"
  kafkaBrokers: "kafka.kafka.svc.cluster.local:9092"
  s3:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
  workerConfig:
    TGW_LISTEN_ADDRESS: "0.0.0.0"
    TGW_S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
    TGW_S3_BUCKET: "tgw-s3-bucket"
    TGW_S3_PATH_STYLE: "true"
    TGW_KAFKA_TOPIC: "tgw.updates"
    # Вебхуки admin-скоупа тенантам недоступны, у воркеров они выключены.
    TGW_WEBHOOKS_ENABLED: "false"
edge:
  enabled: true

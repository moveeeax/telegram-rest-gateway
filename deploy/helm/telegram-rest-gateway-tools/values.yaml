# Секрет с токенами (создать заранее): TGW_BEARER_TOKEN (MCP->gateway, скоуп read,write),
# MCP_HTTP_TOKEN (клиент->MCP), ARCHIVER_TOKEN (доступ к /search).
existingSecret: "tgw-tools"

# Имя Service гейтвея по sessionId и его порт (из основного чарта: <release>-<sessionId>).
gatewayServiceTemplate: "tgw-{sessionId}"
gatewayPort: 8080

archiver:
  enabled: true
  image: "docker.io/resert/telegram-rest-gateway-archiver:v1.2.0"
  pullPolicy: IfNotPresent
  kafkaBrokers: "kafka.kafka.svc.cluster.local:9092"
  kafkaTopic: "tgw.updates"
  kafkaGroup: "tgw-archiver"
  # SQLite-файл — единственный writer, поэтому PVC + Recreate + replicas 1.
  storage: "2Gi"
  storageClass: ""
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

mcp:
  enabled: true
  image: "docker.io/resert/telegram-rest-gateway-mcp:v1.2.0-2"  # stateful streamable-http
  pullPolicy: IfNotPresent
  httpPort: 8080
  # По одному MCP-серверу на аккаунт (Streamable HTTP, stateless — можно >1 реплики).
  accounts:
    - sessionId: "1214732998"
    - sessionId: "1389231240"
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { memory: 128Mi }

# Ingress для MCP (удалённые агенты). host-шаблон с {sessionId}.
ingress:
  enabled: false
  className: ""
  annotations: {}
  mcpHostTemplate: "mcp-{sessionId}.example.com"
  archiverHost: ""  # хост Ingress архиватора (/search); пусто = не выводить наружу
  tls:
    enabled: false

{{- if .Values.archiver.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-archiver
  labels:
    app.kubernetes.io/name: tgw-archiver
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.archiver.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.archiver.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-archiver
  labels:
    app.kubernetes.io/name: tgw-archiver
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # SQLite — единственный writer: не допускаем два пода на один файл.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tgw-archiver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgw-archiver
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: archiver
          image: {{ .Values.archiver.image | quote }}
          imagePullPolicy: {{ .Values.archiver.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: ARCHIVER_KAFKA_BROKERS
              value: {{ .Values.archiver.kafkaBrokers | quote }}
            - name: ARCHIVER_KAFKA_TOPIC
              value: {{ .Values.archiver.kafkaTopic | quote }}
            - name: ARCHIVER_KAFKA_GROUP
              value: {{ .Values.archiver.kafkaGroup | quote }}
            - name: ARCHIVER_DB_PATH
              value: "/data/archive.db"
            - name: ARCHIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ARCHIVER_TOKEN
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.archiver.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-archiver
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-archiver
  labels:
    app.kubernetes.io/name: tgw-archiver
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: http
      port: 8090
      targetPort: http
  selector:
    app.kubernetes.io/name: tgw-archiver
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if and .Values.ingress.enabled .Values.ingress.archiverHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-archiver
  labels:
    app.kubernetes.io/name: tgw-archiver
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.archiverHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-archiver
                port:
                  name: http
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.archiverHost | quote }}]
      secretName: {{ .Release.Name }}-archiver-tls
  {{- end }}
{{- end }}
{{- end }}

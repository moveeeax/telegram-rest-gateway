{{- if and .Values.mcp.enabled .Values.mcp.shared.enabled }}
{{- $sh := .Values.mcp.shared }}
{{- $name := printf "%s-mcp" .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: tgw-mcp-shared
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Сессии MCP живут в памяти процесса: одна реплика.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tgw-mcp-shared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgw-mcp-shared
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ required "mcp.image.tag обязателен: CI публикует immutable short-sha теги, см. docs/CICD.md" .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.mcp.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.httpPort }}
          env:
            - name: MCP_HTTP_PORT
              value: {{ .Values.mcp.httpPort | quote }}
            - name: MCP_REGISTRY_URL
              value: {{ $sh.registryUrl | default (printf "http://%s-control-plane:8096/internal/registry" .Release.Name) | quote }}
            - name: MCP_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sh.registryTokenSecret.name }}
                  key: {{ $sh.registryTokenSecret.key }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ $sh.allowedOrigins | quote }}
            - name: TGW_ARCHIVER_URL
              value: "http://{{ .Release.Name }}-archiver:8090"
            - name: TGW_ARCHIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ARCHIVER_TOKEN
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: tgw-mcp-shared
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: http
      port: {{ .Values.mcp.httpPort }}
      targetPort: http
  selector:
    app.kubernetes.io/name: tgw-mcp-shared
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.edge.enabled }}
{{- include "tools.ingressGuard" (merge (dict "Values" (dict "ingress" (merge (dict "enabled" true) .Values.ingress))) .) }}
---
# Отдельный Ingress: rate limit онбординга (Middleware на tgw-edge) общий на всех клиентов, потому
# что Traefik видит адрес балансировщика, и активный агент одного тенанта упирал бы в 429 остальных.
# Сертификат общий с tgw-edge (там же cert-manager), здесь его только используем.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-shared
  labels:
    app.kubernetes.io/name: tgw-mcp-shared
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.ingress.ipAllowList }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "tools.ipAllowListName" .) }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.edge.hosts.mcp | quote }}]
      secretName: {{ .Release.Name }}-edge-tls
  rules:
    - host: {{ .Values.edge.hosts.mcp | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}

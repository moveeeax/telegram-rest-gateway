# Пример prod-values (без секретов). Секреты — в Secret existingSecret (см. DEPLOY.md).
image:
  # CI не тегирует образ semver — пиньте неизменяемый short-sha релиза (тег image:<sha> в реестре).
  tag: "da77e294"  # неизменяемый short-sha develop с фиксом Kafka

# Пример владельца: реальные Telegram account id продовой инсталляции.
accounts:
  - sessionId: "1214732998"
  - sessionId: "1389231240"

existingSecret: "telegram-rest-gateway"

config:
  TGW_LISTEN_ADDRESS: "0.0.0.0"
  TGW_LISTEN_PORT: "8080"
  # Пример владельца: реальный S3-эндпоинт продовой инсталляции (в дефолтах чарта — пусто).
  TGW_S3_ENDPOINT: "https://s3.tarassov.me"
  TGW_S3_REGION: "us-east-1"
  TGW_S3_BUCKET: "tgw-s3-bucket"
  TGW_S3_PATH_STYLE: "true"
  # Kafka в кластере (namespace kafka, CLIENT-листенер PLAINTEXT на 9092).
  TGW_KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
  TGW_KAFKA_TOPIC: "tgw.updates"

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Внешний доступ: Ingress (nginx) + Let's Encrypt (cert-manager) + external-dns,
# ЖЁСТКО ограниченный IP-allowlist'ом (сервисы отдают контроль над аккаунтом — за периметром).
ingress:
  enabled: true
  className: nginx
  hostTemplate: "tg-{sessionId}.example.com"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "<LB-IP>"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # ОБЯЗАТЕЛЬНО: список доверенных IP. Голый Bearer в интернет не выставляем.
    nginx.ingress.kubernetes.io/whitelist-source-range: "<your.ip>/32"
  tls:
    enabled: true
    secretNameTemplate: "tg-{sessionId}-tls"

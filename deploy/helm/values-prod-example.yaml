# Пример prod-values (без секретов). Секреты — в Secret existingSecret (см. DEPLOY.md).
image:
  # CI не тегирует образ semver — пиньте неизменяемый short-sha релиза (тег image:<sha> в реестре).
  tag: "da77e294"  # неизменяемый short-sha develop с фиксом Kafka

# Пример владельца: реальные Telegram account id продовой инсталляции.
accounts:
  - sessionId: "1000000001"
  - sessionId: "1000000002"

existingSecret: "telegram-rest-gateway"

config:
  TGW_LISTEN_ADDRESS: "0.0.0.0"
  TGW_LISTEN_PORT: "8080"
  # Пример владельца: MinIO внутри кластера oci-k3s (в дефолтах чарта пусто).
  TGW_S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
  TGW_S3_REGION: "us-east-1"
  TGW_S3_BUCKET: "tgw-s3-bucket"
  TGW_S3_PATH_STYLE: "true"
  # Kafka в кластере (namespace kafka, CLIENT-листенер PLAINTEXT на 9092).
  TGW_KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
  TGW_KAFKA_TOPIC: "tgw.updates"

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Внешний доступ: Ingress (Traefik) + Let's Encrypt (cert-manager, DNS-01) + external-dns,
# ограниченный IP-allowlist'ом (сервисы отдают контроль над аккаунтом). Traefik nginx-аннотации
# не читает, allowlist задается ipAllowList (чарт создает Middleware).
ingress:
  enabled: true
  className: traefik
  hostTemplate: "tg-{sessionId}.example.com"
  # ОБЯЗАТЕЛЬНО: список доверенных IP, иначе guard не даст отрендерить Ingress.
  ipAllowList: ["<your.ip>/32"]
  # Форма логина /ui наружу (держится только на allowlist).
  exposeLoginUi: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "<LB-IP>"
  tls:
    enabled: true
    secretNameTemplate: "tg-{sessionId}-tls"

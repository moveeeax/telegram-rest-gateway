name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder

jobs:
  lint-format:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir clang-format==18.1.8
      - run: clang-format --version
      - name: clang-format --dry-run --Werror
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            | xargs -r clang-format --dry-run --Werror

  # Наш код НЕ должен попадать в sanitizer-suppressions (только сторонние символы).
  suppressions-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          hits=$(grep -rnE '(src/|tests/|tgw::)' cmake/suppressions/ | grep -vE ':[0-9]+:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "ОШИБКА: наш код в suppressions — гонки/утечки чиним, а не подавляем:"; echo "$hits"; exit 1;
          fi

  # Дорогой образ TDLib+Drogon. Кэшируется через GHCR + gha; пересобирается
  # быстро, когда пины TDLIB_REF/DROGON_REF и Dockerfile.builder не менялись.
  builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: refs
        run: |
          echo "tdlib=$(grep -E '^TDLIB_REF=' TDLIB_REF | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "drogon=$(grep -E '^DROGON_REF=' DROGON_REF | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          build-args: |
            TDLIB_REF=${{ steps.refs.outputs.tdlib }}
            DROGON_REF=${{ steps.refs.outputs.drogon }}
          tags: ${{ env.BUILDER_IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-asan:
    needs: builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ASAN_OPTIONS: "detect_leaks=1"
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/cmake/suppressions/lsan.supp"
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset asan
      # Только тест-таргет + -j2: держим пиковую память при санитайзерной сборке.
      - run: cmake --build --preset asan --target tgw_unit_tests --parallel 2
      - run: ctest --preset asan --output-on-failure

  test-tsan:
    needs: builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TSAN_OPTIONS: "suppressions=${{ github.workspace }}/cmake/suppressions/tsan.supp halt_on_error=1"
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan --target tgw_unit_tests --parallel 2
      - run: ctest --preset tsan --output-on-failure

  tidy:
    needs: builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev-debug
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git ls-files 'src/*.cpp' | xargs -r clang-tidy -p build/dev-debug --warnings-as-errors='bugprone-*,concurrency-*'

  # Полный exe (Release) — test-джобы собирают только тест-таргет.
  build-app:
    needs: builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ci-release
      - run: cmake --build --preset ci-release --target telegram-rest-gateway

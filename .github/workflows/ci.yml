name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Отменяем устаревшие прогоны на ветках/PR, но НЕ на main и не на git-тегах —
  # там работает publish, прерывать его на середине (частичный набор образов) нельзя.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILDER_IMAGE: ghcr.io/${{ github.repository }}/builder

jobs:
  lint-format:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir clang-format==18.1.8
      - run: clang-format --version
      - name: clang-format --dry-run --Werror
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror {} +

  # Наш код НЕ должен попадать в sanitizer-suppressions (только сторонние символы).
  suppressions-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          hits=$(grep -rnE '(src/|tests/|tgw::)' cmake/suppressions/ | grep -vE ':[0-9]+:[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "ОШИБКА: наш код в suppressions — гонки/утечки чиним, а не подавляем:"; echo "$hits"; exit 1;
          fi

  # TS-сайдкары (archiver, mcp): сборка tsc + docker build их Dockerfile'ов БЕЗ пуша.
  # Ловит сломанный TS и сломанный образ сайдкара до релиза (на каждом PR/push).
  node-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [archiver, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ${{ matrix.pkg }}
      - run: npm run build
        working-directory: ${{ matrix.pkg }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.pkg }}
          file: ${{ matrix.pkg }}/Dockerfile
          push: false

  # Дорогой образ TDLib+Drogon. Content-addressed тег: builder:<hash>, где
  # hash = sha256(Dockerfile.builder + TDLIB_REF + DROGON_REF), 16 симв. Пины/рецепт
  # не менялись → тот же тег → downstream тянет готовый образ (сборки нет). Изменились
  # → новый тег → пересборка+пуш. Так уходит отравление мутабельного :latest и гонки
  # между ветками. :latest дополнительно пушим только с main как «последний тулчейн».
  builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      available: ${{ steps.meta.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Логин: нужен для пуша и для inspect приватного образа. В форк-PR токен
      # read-only — этого достаточно, чтобы ТЯНУТЬ уже существующий builder.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          tdlib=$(grep -E '^TDLIB_REF=' TDLIB_REF | cut -d= -f2)
          drogon=$(grep -E '^DROGON_REF=' DROGON_REF | cut -d= -f2)
          hash=$(cat Dockerfile.builder TDLIB_REF DROGON_REF | sha256sum | cut -c1-16)
          image="${BUILDER_IMAGE}:${hash}"
          {
            echo "tdlib=$tdlib"
            echo "drogon=$drogon"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "content-тег уже в GHCR: $image — пересборка не нужна"
            echo "exists=true"    >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            # Форк-PR: токен read-only, запушить нельзя. Собираем локально (валидация
            # рецепта), но downstream C++-джобы тянуть образ не смогут → они скипаются.
            echo "форк-PR: content-тег $image отсутствует, пуш недоступен — downstream скипнется"
            echo "exists=false"    >> "$GITHUB_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "content-тег $image отсутствует — соберём и запушим"
            echo "exists=false"   >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Обычный случай: тега нет и мы можем писать (push в ветку/тег или PR из своего репо).
      - name: build+push builder (content tag)
        if: steps.meta.outputs.exists == 'false' && steps.meta.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          build-args: |
            TDLIB_REF=${{ steps.meta.outputs.tdlib }}
            DROGON_REF=${{ steps.meta.outputs.drogon }}
          tags: ${{ steps.meta.outputs.image }}
          push: true
          # Отдельный scope: у builder'а и сервисного образа разные слои — общий scope
          # gha-кэша они бы затирали друг у друга.
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder
      # :latest — только с main, указывает на свежесобранный content-тег.
      - name: retag builder :latest (main only)
        if: steps.meta.outputs.exists == 'false' && steps.meta.outputs.available == 'true' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t "${BUILDER_IMAGE}:latest" "${{ steps.meta.outputs.image }}"
      # Форк-PR без готового тега: локальная сборка (без пуша) как валидация рецепта.
      - name: build builder locally (fork PR, no push)
        if: steps.meta.outputs.exists == 'false' && steps.meta.outputs.available == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          build-args: |
            TDLIB_REF=${{ steps.meta.outputs.tdlib }}
            DROGON_REF=${{ steps.meta.outputs.drogon }}
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=builder

  # arm64-тулчейн: тот же рецепт и тот же content-hash, тег с суффиксом -arm64.
  # Собирается нативно на ubuntu-24.04-arm (TDLib под QEMU нереалистична) и только
  # если такого тега ещё нет. Нужен только publish'у: тесты гоняются на amd64.
  builder-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      available: ${{ steps.meta.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          tdlib=$(grep -E '^TDLIB_REF=' TDLIB_REF | cut -d= -f2)
          drogon=$(grep -E '^DROGON_REF=' DROGON_REF | cut -d= -f2)
          hash=$(cat Dockerfile.builder TDLIB_REF DROGON_REF | sha256sum | cut -c1-16)
          image="${BUILDER_IMAGE}:${hash}-arm64"
          {
            echo "tdlib=$tdlib"
            echo "drogon=$drogon"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "content-тег уже в GHCR: $image — пересборка не нужна"
            echo "exists=true"    >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            # Форк-PR: пушить нельзя, а локальная arm64-сборка TDLib на каждый
            # форк-PR слишком дорога. Рецепт и так проверяет amd64-builder.
            echo "форк-PR: $image отсутствует, пуш недоступен — пропускаем"
            echo "exists=false"    >> "$GITHUB_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "content-тег $image отсутствует — соберём и запушим"
            echo "exists=false"   >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: build+push arm64 builder (content tag)
        if: steps.meta.outputs.exists == 'false' && steps.meta.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/arm64
          build-args: |
            TDLIB_REF=${{ steps.meta.outputs.tdlib }}
            DROGON_REF=${{ steps.meta.outputs.drogon }}
          tags: ${{ steps.meta.outputs.image }}
          push: true
          cache-from: type=gha,scope=builder-arm64
          cache-to: type=gha,mode=max,scope=builder-arm64

  test-asan:
    needs: builder
    if: needs.builder.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ASAN_OPTIONS: "detect_leaks=1"
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset asan
      # Только тест-таргет + -j2: держим пиковую память при санитайзерной сборке.
      # LSAN_OPTIONS с путём к suppressions задаётся в шаге, а не на уровне джоба,
      # чтобы $PWD (путь в контейнере) был доступен, а не ${{ github.workspace }} (хостовый путь).
      - run: |
          export LSAN_OPTIONS="suppressions=$PWD/cmake/suppressions/lsan.supp"
          cmake --build --preset asan --target tgw_unit_tests --parallel 2
      - run: |
          export LSAN_OPTIONS="suppressions=$PWD/cmake/suppressions/lsan.supp"
          ctest --preset asan --output-on-failure

  test-tsan:
    needs: builder
    if: needs.builder.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset tsan
      # TSAN_OPTIONS с путём к suppressions задаётся в шаге, а не на уровне джоба,
      # чтобы $PWD (путь в контейнере) был доступен, а не ${{ github.workspace }} (хостовый путь).
      - run: |
          export TSAN_OPTIONS="suppressions=$PWD/cmake/suppressions/tsan.supp halt_on_error=1"
          cmake --build --preset tsan --target tgw_unit_tests --parallel 2
      - run: |
          export TSAN_OPTIONS="suppressions=$PWD/cmake/suppressions/tsan.supp halt_on_error=1"
          ctest --preset tsan --output-on-failure

  tidy:
    needs: builder
    if: needs.builder.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev-debug
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git ls-files 'src/*.cpp' | xargs -r clang-tidy -p build/dev-debug --warnings-as-errors='bugprone-*,concurrency-*'

  # Полный exe (Release) — test-джобы собирают только тест-таргет.
  build-app:
    needs: builder
    if: needs.builder.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ci-release
      - run: cmake --build --preset ci-release --target telegram-rest-gateway

  # Публикация образов в GHCR. Только push в main или git-тег vX.Y.Z — из PR (в т.ч.
  # форков) не срабатывает, поэтому read-only токен форка пайплайн не красит.
  # Гейт на зелёные санитайзеры/tidy/exe — не публикуем непроверенное.
  # Multi-arch: каждая архитектура собирается нативно на своём раннере, корневой
  # Dockerfile делает FROM builder своей архитектуры (amd64: builder:<hash>,
  # arm64: builder:<hash>-arm64). Образы пушатся по дайджесту без тегов, теги
  # :<short-sha> и :vX.Y.Z ставит publish-merge, склеивая обе архитектуры.
  publish:
    name: publish (${{ matrix.arch }})
    needs: [builder, builder-arm64, test-asan, test-tsan, tidy, build-app]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.builder-arm64.outputs.available == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      GW_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Корневой сервис: FROM content-addressed builder своей архитектуры.
      - name: build+push gateway (by digest)
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILDER_IMAGE=${{ matrix.arch == 'arm64' && needs.builder-arm64.outputs.image || needs.builder.outputs.image }}
          outputs: type=image,name=${{ env.GW_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch == 'arm64' && 'gateway-arm64' || 'gateway' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch == 'arm64' && 'gateway-arm64' || 'gateway' }}
      - name: build+push archiver (by digest)
        id: archiver
        uses: docker/build-push-action@v6
        with:
          context: archiver
          file: archiver/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GW_IMAGE }}-archiver,push-by-digest=true,name-canonical=true,push=true
      - name: build+push mcp (by digest)
        id: mcp
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GW_IMAGE }}-mcp,push-by-digest=true,name-canonical=true,push=true
      - name: export digests
        env:
          GW_DIGEST: ${{ steps.gateway.outputs.digest }}
          AR_DIGEST: ${{ steps.archiver.outputs.digest }}
          MC_DIGEST: ${{ steps.mcp.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$GW_DIGEST" > digests/gateway
          echo "$AR_DIGEST" > digests/archiver
          echo "$MC_DIGEST" > digests/mcp
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Склейка per-arch дайджестов в multi-arch теги. Теги те же, что раньше:
  # :<short-sha> всегда, :vX.Y.Z дополнительно на git-теге.
  publish-merge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch tags
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          base="ghcr.io/${{ github.repository }}"
          for img in gateway archiver mcp; do
            case "$img" in
              gateway) name="$base" ;;
              *)       name="${base}-${img}" ;;
            esac
            tags=(-t "${name}:${sha}")
            # На git-теге vX.Y.Z добавляем человекочитаемый версионный тег.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tags+=(-t "${name}:${GITHUB_REF_NAME}")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "${name}@$(cat digests/digests-amd64/${img})" \
              "${name}@$(cat digests/digests-arm64/${img})"
            docker buildx imagetools inspect "${name}:${sha}"
          done
